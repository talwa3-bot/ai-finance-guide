<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Finance Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&family=Heebo:wght@400;700;900&family=Assistant:wght@400;700;800&family=Secular+One&family=Frank+Ruhl+Libre:wght@500;700;900&family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-tab="media">
<div id="app">
  <header class="top">
    <div class="brand"><img src="assets/logo-mark.jpg" alt="AI Finance"><span class="studio">STUDIO</span></div>
    <input id="projName" class="pname" aria-label="שם הפרויקט" maxlength="60">
    <span id="saveState" class="save">נשמר</span>
    <select id="fmt" aria-label="פורמט">
      <option value="16:9">16:9 רוחבי</option>
      <option value="9:16">9:16 רילס</option>
      <option value="1:1">1:1 ריבוע</option>
      <option value="4:5">4:5 פיד</option>
    </select>
    <button id="btnExport" class="btn primary" type="button">ייצוא</button>
  </header>

  <aside class="lib">
    <nav class="tabs" id="tabs">
      <button type="button" data-tab="media">מדיה</button>
      <button type="button" data-tab="text">טקסט</button>
      <button type="button" data-tab="cap">כתוביות</button>
      <button type="button" data-tab="brand">מותג</button>
      <button type="button" data-tab="ai">במאי</button>
      <button type="button" data-tab="edit" class="only-m">עריכה</button>
    </nav>
    <div class="panel" id="panel"></div>
  </aside>

  <section class="stage">
    <div class="cvwrap" id="cvwrap"><canvas id="cv" width="1920" height="1080"></canvas></div>
    <div class="transport">
      <span class="tc" id="tc">00:00:00</span>
      <div class="tbtns">
        <button type="button" class="ib" data-a="toStart" aria-label="להתחלה"></button>
        <button type="button" class="ib" data-a="back" aria-label="פריים אחורה"></button>
        <button type="button" class="ib play" id="btnPlay" data-a="play" aria-label="ניגון"></button>
        <button type="button" class="ib" data-a="fwd" aria-label="פריים קדימה"></button>
        <button type="button" class="ib" data-a="toEnd" aria-label="לסוף"></button>
      </div>
      <span class="tinfo" id="tinfo"></span>
    </div>
  </section>

  <aside class="insp" id="insp"></aside>

  <section class="tl">
    <div class="tlbar" id="tlbar">
      <button type="button" class="tb" data-a="undo">בטל</button>
      <button type="button" class="tb" data-a="redo">בצע שוב</button>
      <i class="sep"></i>
      <button type="button" class="tb" data-a="split">פיצול</button>
      <button type="button" class="tb" data-a="del">מחיקה</button>
      <button type="button" class="tb" data-a="dup">שכפול</button>
      <button type="button" class="tb" data-a="gaps">סגירת רווחים</button>
      <button type="button" class="tb" data-a="silence">הסרת שתיקות</button>
      <i class="sep"></i>
      <button type="button" class="tb" data-a="addText">+ טקסט</button>
      <button type="button" class="tb" data-a="trkVideo">+ ערוץ וידאו</button>
      <button type="button" class="tb" data-a="trkAudio">+ ערוץ אודיו</button>
      <label class="zoom"><span>זום</span><input id="zoom" type="range" min="8" max="240" step="1" value="70" aria-label="זום ציר הזמן"></label>
    </div>
    <div class="tlbody" id="tlbody">
      <div class="heads" id="heads"></div>
      <div class="scroller" id="scroller">
        <div class="ruler" id="ruler"></div>
        <div class="rows" id="rows"></div>
        <div class="playhead" id="playhead"></div>
      </div>
    </div>
  </section>
</div>

<div class="modal" id="modal" hidden><div class="mbox" id="mbox" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status"></div>
<input type="file" id="fileIn" multiple accept="video/*,audio/*,image/*" hidden>
<input type="file" id="srtIn" accept=".srt,.vtt,text/plain" hidden>

<script src="engine.js"></script>
<script src="ui.js"></script>
<script src="ai.js"></script>
</body>
</html>
